<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表單作業01</title>
    <link rel="stylesheet" href="../reset.css">
    <link rel="stylesheet" href="formhw_01.css">
</head>
<body>
    <header></header>
    <main>
        <section>
            <form action="">
                <section class="card header-card">
                    <div>
                        <h1>F2E02 表單練習</h1>
                        <div class="description">僅供新尖兵標單切版練習作業</div>
                        <span class="userAccount">paggy881025@gmail.com</span>
                        <a href="https://accounts.google.com/v3/signin/accountchooser?continue=https%3A%2F%2Fdocs.google.com%2Fforms%2Fd%2Fe%2F1FAIpQLSeRMAUDqY6GEPiHotfXZQLvGOQgB1nLfxA_TW-uwlC5vb8CWQ%2Fviewform&service=wise&flowName=GlifWebSignIn&flowEntry=AccountChooser&dsh=S50651991%3A1776173416739760" class="changeAccount">切換帳號</a>
                        <p class="unSharedContnt">未共享的内容</p>
                        <small>草稿已保存</small>
                        <p class="redFont">*表示必填</p>
                    </div>
                </section>
                <section class="card">
                    <div class="formGroup">
                        <label for="name">
                            姓名
                            <span class="redFont">*</span>
                        </label>
                        <input type="text" class="name" placeholder="您的回答" required>
                    </div>
                </section>
                <section class="card">
                    <div class="formGroup">
                        <label for="email">
                            信箱
                            <span class="redFont">*</span>
                        </label> 
                        <input type="email" placeholder="您的回答" required class="email">   
                    </div>
                </section>
                <section class="card">
                    <div class="formGroup">
                        <label for="bDay">生日</label> 
                        <small>日期</small>  
                        <input type="date" class="bDay"> 
                    </div>
                </section>
                <section class="card">
                    <div class="formGroup">
                        <label for="">想跟老師說悄悄話</label>
                        <input type="text" placeholder="您的回答">
                    </div>
                </section>
                <section class="card">
                    <div class="formGroup">
                        <label>喜歡的顏色</label>
                            <label>
                                <input type="radio" name="color" id="yellow">黃
                            </label> 
                            <label>
                                <input type="radio" name="color" id="green">綠
                            </label>
                            <label>
                                <input type="radio" name="color" id="red">紅
                            </label>
                    </div>
                </section>
                <section class="card">
                    <div class="formGroup">
                        <label>喜歡吃的飲食類型</label>
                        <label>
                            <input type="checkbox" name="foodType" id="Chinese">中式
                        </label>
                        <label>
                            <input type="checkbox" name="foodType" id="Japanese">日式
                        </label>
                        <label>
                            <input type="checkbox" name="foodType" id="Italian">義式
                        </label>
                        <label>
                            <input type="checkbox" name="foodType" id="Korean">韓式
                        </label>
                        <label>
                            <input type="checkbox" name="foodType" id="American">美式
                        </label>
                        <label>
                            <input type="checkbox" name="foodType" id="Thai">泰式
                        </label>
                    </div>
                </section>
                <section class="card">
                    <div class="formGroup">
                        <label>最想去的國家</label>
                            <select name="" id="">
                                <option value="" disabled selected hidden>選擇</option>
                                <optgroup label="亞洲">
                                    <option value="Japan">日本</option>
                                    <option value="Korea">韓國</option>
                                    <option value="Thailand">泰國</option>
                                </optgroup>
                                <optgroup label="歐洲">
                                    <option value="Germany">德國</option>
                                    <option value="UK">英國</option>
                                </optgroup>
                                <optgroup label="美洲">
                                    <option value="Canada">加拿大</option>
                                    <option value="USA">美國</option>
                                </optgroup>
                            </select>
                    </div>
                </section>
                <section>
                    <button type="submit" class="submitBtn">提交</button>
                    <button type="reset">清除表單內容</button>
                </section>
            </form>
        </section>
    </main>
    <footer>
        <p>
            <small class="column">切勿通过 Google 表单提交密码。</small>

            <div>
                <a href="https://workspace.google.com/products/forms/?utm_source=product&utm_medium=forms_logo&utm_campaign=forms">Goole 表單</a>
            </div>
            
        </p>

    </footer>
</body>
</html>
